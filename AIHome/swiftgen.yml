fonts:
  inputs:
    - AIHome/Resources/Fonts
  outputs:
    - templateName: swift5
      output: AIHome/Resources/Fonts/Fonts.swift
      params:
        fontAliasName: CustomFont

strings:
  inputs:
    - AIHome/Resources/Localizable/en.lproj/Localizable.strings
  outputs:
    - templatePath: swiftgen-strings.stencil
      output: AIHome/Resources/Localizable/Strings.swift
